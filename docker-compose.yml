services:
  vigilix:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/vigilix.db}
      CHROMA_PERSIST_DIR: /app/data/chroma
      KNOWLEDGE_DIR: /app/data/knowledge
      SAMPLE_LOGS_DIR: /app/data/sample_logs
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.1}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-700}
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-4}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-minimaxai/minimax-m3.1-flash}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_EMBEDDING_MODEL: ${NVIDIA_EMBEDDING_MODEL:-nvidia/nv-embedqa-e5-v5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-meta-llama/Llama-3.3-70B-Instruct}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
